<html>
  <head>
    <title>employee dashboard</title>
  </head>
  <body>
    <header>
      <h1>employee management system</h1>

        <a href="">Dashboard</a>

        <a href="">Departments</a>
        <a href="">Reports</a>
        <a href="">Logout</a>
      </nav>
    </header>
    <hr />
    <main>
      <section>
        <h2>Dashboard</h2>
        <table border="1" cellpadding="15">
          <tr>
            <th>Total employee</th>
            <th>Present</th>
            <th>Absent</th>

          </tr>
          <tr>
            <td>250</td>
            <td>225</td>
            <td>25</td>
            <td>8</td>
          </tr>
        </table>
      </section>
      <hr />

        <h2>Employee list</h2>
        <table border="1" cellpadding="10">
          <thead>
            <tr>
              <th>id</th>
              <th>name</th>
              <th>department</th>
              <th>position</th>
              <th>salary</th>

          </thead>
          <tbody>
            <tr>
              <th>101</th>
              <th>madhavi</th>
              <th>it</th>
              <th>developer</th>
              <th>15000</th>
            </tr>
            <tr>
              <th>102</th>
              <th>mital</th>
              <th>it</th>
              <th>developer</th>
              <th>45000</th>
            </tr>
          </tbody>
        </table>
      </section>
      <section>
        <h2>Department list</h2>
        <table border="1" cellpadding="10">
          <tr>
            <td>D.name</td>
            <td>total department</td>
            <td></td>
          </tr>
        </table>
      </section>
    </main>
  </body>
</html>
