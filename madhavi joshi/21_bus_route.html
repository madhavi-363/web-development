<html>
  <head>
    <title>bus route</title>
  </head>
  <body>
    <from action="success.html">
      <table border="1" cellpadding="10" width="100%" bgcolor="CD5C5C">
        <tr>
          <td>
            <lable for="source"><font color="white">source</font></lable>
            <br />
            <input type="text" name="source" id="source" required />
          </td>
          <td>
            <lable for="destination"
              ><font color="white">destination</font></lable
            >
            <br />
            <input type="text" name="destination" id="destination" />
          </td>
          <td>
            <lable for="journeydate">date</lable>
            <br />
            <input type="date" name="journeydate" id="journeydate" />
          </td>
          <td>
            <lable for="">seats</lable>
            <br />
            <select name="seats" id="seat">
              <option value="1">1</option>
              <option value="2">2</option>
              <option value="3">3</option>
              <option value="4">4</option>
              <option value="5">5</option>
              <option value="6">6</option>
            </select>
          </td>
          <td>
            <lable for="">bus type</lable>
            <br />
            <lable for="express">
              <input type="checkbox" name="express" id="express" />express
            </lable>
            <br />
            <lable for="ac">
              <input type="checkbox" name="ac" id="ac" />ac
            </lable>
            <br />
            <lable for="volvo">
              <input type="checkbox" name="volvo" id="volvo" />volvo
            </lable>
            <br />
            <lable for="sleeper">
              <input type="checkbox" name="sleeper" id="sleeper" />sleeper
            </lable>
          </td>
          <td>
            <lable for="">select gender</lable>
            <br />
            <lable for="male">
              <input type="radio" name="male" id="male" />male
            </lable>
            <br />
            <lable for="female">
              <input type="radio" name="female" id="female" />female
            </lable>
          </td>
          <td>
            <input type="submit" value="search" />
          </td>
        </tr>
      </table>
    </from>
  </body>
</html>
